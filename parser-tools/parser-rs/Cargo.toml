[package]
name = "parser-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.44.1", features = ["rt", "rt-multi-thread", "macros", "time"] }
rdkafka = "0.38.0"
serde = { version = "1.0.228", features = ["derive"] }
protobuf = "2.28.0"
reqwest = {version = "0.12.24", features = ["json", "gzip", "brotli"] }
rabbitmq-stream-client = "*"
dotenv = "0.15.0"
clickhouse = { version = "0.15.2", features = ["inserter", "chrono", "rustls-tls", "zstd"] }
chrono = "0.4"
serde_json = "1"
memmap2 = "0.9"
memchr = "2"
flume = "0.11"
dashmap = "6"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[[bin]]
name = "main"
path = "src/main.rs"

# Offline runner for the zombie-rate classifier over a billing-codes CSV (no network/DB deps).
[[bin]]
name = "classify_codes"
path = "src/bin/classify_codes.rs"
[build-dependencies]
protobuf-codegen-pure = "2.28.0"

# Local patch of the ClickHouse client: when the insert request task dies mid-stream the
# upstream crate reports an opaque "channel closed" and drops the real server/HTTP error.
# vendor/clickhouse/src/insert_formatted.rs::poll_ready surfaces the underlying error instead.
[patch.crates-io]
clickhouse = { path = "vendor/clickhouse" }
