<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>job-controller</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1117; --panel: #171a23; --line: #262b38; --text: #e6e8ee; --dim: #9aa3b5;
        --accent: #6ea8fe; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
        --download: #6ea8fe; --decompress: #c084fc; --parse: #4ade80; --clean: #9aa3b5;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #f6f7f9; --panel: #fff; --line: #e3e6ec; --text: #12151c; --dim: #626b7d; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      header {
        display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
        padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
        background: var(--bg); z-index: 1;
      }
      h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
      .muted { color: var(--dim); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      main { padding: 20px; display: grid; gap: 20px; max-width: 1200px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 12px; font-weight: 600; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
      .stat .n { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .stat .l { color: var(--dim); font-size: 12px; }
      table { width: 100%; border-collapse: collapse; }
      th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; padding: 4px 8px 8px 0; }
      td { padding: 6px 8px 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 90px; }
      .bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
      .step { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
      .step.downloading { background: color-mix(in srgb, var(--download) 22%, transparent); color: var(--download); }
      .step.decompressing { background: color-mix(in srgb, var(--decompress) 22%, transparent); color: var(--decompress); }
      .step.parsing { background: color-mix(in srgb, var(--parse) 22%, transparent); color: var(--parse); }
      .step.cleaning { background: color-mix(in srgb, var(--clean) 22%, transparent); color: var(--clean); }
      .node { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      .node:last-child { margin-bottom: 0; }
      .node h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
      .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--line); color: var(--dim); font-weight: 500; }
      .tag.self { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
      .detail { color: var(--dim); font-size: 12px; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .empty { color: var(--dim); font-style: italic; padding: 8px 0; }
      tr.op { cursor: pointer; }
      tr.op:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
      .caret { display: inline-block; width: 12px; color: var(--dim); transition: transform .15s ease; }
      tr.open .caret { transform: rotate(90deg); }
      tr.logs > td { padding: 0 0 10px; }
      pre.console {
        margin: 0; padding: 10px 12px; border-radius: 8px; background: #0b0d13; color: #d7dbe6;
        border: 1px solid var(--line); max-height: 320px; overflow: auto;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word;
      }
      pre.console .t { color: #5d6474; }
      pre.console .err { color: var(--bad); }
      .runs td { font-size: 13px; }
      .status { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
      .status.running { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
      .status.done { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
      .status.failed { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ok); }
      .dot.stale { background: var(--warn); }
      @media (max-width: 640px) { main { padding: 12px; } .hide-sm { display: none; } }
    </style>
  </head>
  <body>
    <header>
      <h1>job-controller</h1>
      <span class="muted mono" id="this-node">—</span>
      <span class="muted" id="updated" style="margin-left:auto">connecting…</span>
    </header>
    <main>
      <section>
        <h2>Run progress</h2>
        <div class="stats" id="progress"></div>
      </section>
      <section>
        <h2>Nodes</h2>
        <div id="nodes"></div>
      </section>
      <section>
        <h2>Operations <span class="muted" style="text-transform:none;letter-spacing:0" id="log-dir"></span></h2>
        <table class="runs">
          <thead>
            <tr><th style="width:18px"></th><th>Operation</th><th>Status</th><th class="num">Lines</th><th class="num">Started</th><th class="num">Elapsed</th></tr>
          </thead>
          <tbody id="runs"></tbody>
        </table>
      </section>
      <section>
        <h2>Queues</h2>
        <table>
          <thead>
            <tr><th>Queue</th><th class="num">Waiting</th><th class="num">In flight</th><th class="num">Dead</th></tr>
          </thead>
          <tbody id="queues"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
